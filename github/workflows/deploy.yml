name: Deploy to Public Pages

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4

      - name: Prepare dist
        run: |
          mkdir -p dist
          cp -r index.html data/ dist/

      - name: Deploy to external repository
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: despinozai/prueba-publico
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true
